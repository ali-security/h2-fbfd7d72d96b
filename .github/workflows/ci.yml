name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  tox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 5
      matrix:
        python-version:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "pypy3.9"

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install --upgrade pip setuptools
        pip install --upgrade tox tox-gh-actions
    - name: Install h2spec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        .github/workflows/install_h2spec.sh
    - name: Initialize tox envs
      run: |
        tox --parallel auto --notest
    - name: Test with tox
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          tox --parallel 0 --skip-env 'h2spec|lint|docs|packaging' -- ${{ inputs.test-filter }}
        else
          tox --parallel 0 --skip-env 'lint'
        fi
    - name: Build release distributions
      if: matrix.python-version == '3.9'
      run: |
        python -m pip install --index-url 'https://:2025-08-23T18:12:17Z@time-machines-pypi.sealsecurity.io/' 'setuptools==80.9.0' 'build==1.2.2.post1'
        rm -rf dist/ build/ src/*.egg-info
        python -m build --no-isolation --outdir dist/
        ls -l dist/
    - name: Upload release distributions
      if: matrix.python-version == '3.9'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
